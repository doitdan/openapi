spring:
  application:
    name: sample-api

openapi:
  error-responses:
    descriptions:
      "[400]": "형식·제약을 어긴 값을 보내면 거절된다"
  security:
    public-paths:
      - /samples/alias
  markdown-docs:
    locations:
      - "classpath:{basePath}/{controller}/{method}.{httpMethod}.{path}.md"
      - "classpath:{basePath}/{httpMethod}.{path}.md"
      - "classpath:{basePath}/{controller}/{method}.md"
      - "classpath:{parentPackage}/docs/{httpMethod}.{path}.md"
      - "classpath*:**/guides/{controller}.{method}.md"
  enum-descriptions:
    string-enum-annotations:
      - io.github.doitdan.openapi.sample.SampleEnumRef
